appId: pretext.example
---
- launchApp:
    clearState: true
- tapOn:
    id: "home.open-examples"
- tapOn:
    id: "examples.open-use-case"
- scrollUntilVisible:
    direction: DOWN
    element:
      id: "examples.use-case.open.prepare"
    timeout: 20000
- tapOn:
    id: "examples.use-case.open.prepare"
- scrollUntilVisible:
    direction: DOWN
    element:
      id: "examples.use-case.prepare.release"
    timeout: 20000
- tapOn:
    id: "examples.use-case.prepare.release"
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "API_EXAMPLE_REPORT::examples/use-case/prepare::.*"
    timeout: 20000
    visibilityPercentage: 1
- copyTextFrom:
    text: "API_EXAMPLE_REPORT::examples/use-case/prepare::.*"
- runScript:
    file: ../../scripts/log-api-example-report.js
    env:
      reportPrefix: API_EXAMPLE_REPORT
      routePath: examples/use-case/prepare
      requiredFields: hasPrepared,paragraphCount,publicFields,rawNativeIdExposed,released,releaseError,statsTotalMs

