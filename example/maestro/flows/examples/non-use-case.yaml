appId: pretext.example
---
- launchApp:
    clearState: true
- tapOn:
    id: "home.open-examples"
- tapOn:
    id: "examples.open-non-use-case"
- scrollUntilVisible:
    direction: DOWN
    element:
      id: "examples.non-use-case.open.prepare"
    timeout: 20000
- tapOn:
    id: "examples.non-use-case.open.prepare"
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "NON_USE_CASE_REPORT::examples/non-use-case/prepare::.*"
    timeout: 20000
    visibilityPercentage: 1
- copyTextFrom:
    text: "NON_USE_CASE_REPORT::examples/non-use-case/prepare::.*"
- runScript:
    file: ../../scripts/log-api-example-report.js
    env:
      reportPrefix: NON_USE_CASE_REPORT
      routePath: examples/non-use-case/prepare
      requiredFields: callbackCount,hiddenNodeCount,renderPassCount

