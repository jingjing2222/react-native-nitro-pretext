# 성공 흐름
# benchmark landing -> PreText layout ready -> PreText layout benchmark complete -> report emitted
# 사용하는 seed / selector anchor
# benchmark/pretext-layout CTA text, hero copy, automation status/report lines
appId: pretext.example
---
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "Open benchmark/pretext-layout"
    timeout: 20000
- tapOn: "Open benchmark/pretext-layout"
- assertVisible: "Run PreText layout before the visible RN text surface\\."
- assertVisible:
    text: "AUTOMATION_STATUS::benchmark/pretext-layout::(ready|completed)::.*"
- extendedWaitUntil:
    visible:
      text: "Run PreText Layout Benchmark"
    timeout: 120000
- tapOn: "Run PreText Layout Benchmark"
- extendedWaitUntil:
    visible:
      text: "AUTOMATION_STATUS::benchmark/pretext-layout::completed::.*"
    timeout: 180000
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "AUTOMATION_REPORT::benchmark/pretext-layout::.*"
    timeout: 20000
    visibilityPercentage: 1
- copyTextFrom:
    text: "AUTOMATION_REPORT::benchmark/pretext-layout::.*"
- runScript:
    file: ../../../scripts/log-benchmark-report.js
    env:
      reportName: preparedView
- assertTrue: ${output.reports.preparedView.renderInteractionMedianMs != null}
- assertTrue: ${output.reports.preparedView.computeLayoutOnlyMedianMs != null}
- takeScreenshot:
    path: .maestro-artifacts/pretext-layout-complete
- tapOn: "Back to benchmark/\\*"
- assertVisible: "Benchmark routes stay isolated from API examples\\."
