# 성공 흐름
# benchmark landing -> prepared state ready -> prepared view benchmark complete -> prepared report emitted
# 사용하는 seed / selector anchor
# benchmark/prepared-view CTA text, prepared hero copy, prepared automation status/report lines
appId: pretext.example
---
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "Open benchmark/prepared-view"
    timeout: 20000
- tapOn: "Open benchmark/prepared-view"
- assertVisible: "Feed prepared paragraph state directly into a native paragraph surface\\."
- assertVisible:
    text: "AUTOMATION_STATUS::benchmark/prepared-view::(ready|completed)::.*"
- extendedWaitUntil:
    visible:
      text: "Run Prepared View Benchmark"
    timeout: 120000
- tapOn: "Run Prepared View Benchmark"
- extendedWaitUntil:
    visible:
      text: "AUTOMATION_STATUS::benchmark/prepared-view::completed::.*"
    timeout: 180000
- scrollUntilVisible:
    direction: DOWN
    element:
      text: "AUTOMATION_REPORT::benchmark/prepared-view::.*"
    timeout: 20000
    visibilityPercentage: 1
- copyTextFrom:
    text: "AUTOMATION_REPORT::benchmark/prepared-view::.*"
- runScript:
    file: ../../../scripts/log-benchmark-report.js
    env:
      reportName: preparedView
- assertTrue: ${output.reports.preparedView.renderInteractionMedianMs != null}
- assertTrue: ${output.reports.preparedView.computeLayoutOnlyMedianMs != null}
- takeScreenshot:
    path: .maestro-artifacts/prepared-view-complete
- tapOn: "Back to benchmark/\\*"
- assertVisible: "Benchmark routes stay isolated from API examples\\."
